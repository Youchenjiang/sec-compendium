# SonarCloud Automatic Analysis Configuration
# Global exclusions
sonar.exclusions=ctfd/database/**,ctfd/challenges/**,ctfd/automation/**,ctfd/assets/**,ctfd/plugins/**,**/*.sql,**/*.exe,**/*.obj,**/*.pdb,**/*.patch,security/labs/**,security/challenges/**

# Duplication detection (CPD) exclusions
sonar.cpd.exclusions=ctfd/challenges/**,ctfd/database/**,ctfd/plugins/**,ctfd/automation/**,ctfd/assets/**,**/*.sql,**/*.c,**/*.h,**/*.md,security/labs/**,security/challenges/**
