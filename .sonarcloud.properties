# SonarCloud Automatic Analysis Configuration
# Global exclusions (ranges, challenges, wargame case studies and course attack-lab scripts contain intentional CTF lab constructs)
sonar.exclusions=**/*.sql,**/*.exe,**/*.obj,**/*.pdb,**/*.patch,security/labs/**,security/challenges/**,security/knowledge/**/ranges/**,security/practice/challenges/**,**/ranges/**/web_vuln/**,tracks/**/wargame_case_study/**,tracks/courses/**/sessions/**/scripts/**

# Duplication detection (CPD) exclusions
sonar.cpd.exclusions=**/*.sql,**/*.c,**/*.h,**/*.md,security/labs/**,security/challenges/**,security/knowledge/**/ranges/**,security/practice/challenges/**,tracks/**/wargame_case_study/**,security/tools/**,tracks/courses/**/deck-studio/**
