name: Validate Documentation & Playbooks

on:
  push:
    branches: [main]
    paths:
      - 'security/**'
      - 'tracks/**'
      - 'docs/**'
      - '*.md'
      - '.github/workflows/validate-playbooks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'security/**'
      - 'tracks/**'
      - 'docs/**'
      - '*.md'
      - '.github/workflows/validate-playbooks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-playbooks:
    name: Documentation & Playbooks Quality Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Playbooks Validator
        run: |
          cd security
          python tools/validate_playbooks.py
