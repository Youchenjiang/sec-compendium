<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #ffffff; }
  body { width: 1200px; height: 640px; overflow: hidden; }
  svg { display: block; }
  text { font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif; font-size: 18px; fill: #1f2328; }
  .mono { font-family: Consolas, "Cascadia Mono", monospace; font-size: 17px; }
  .title { font-size: 20px; font-weight: 700; }
  .small { font-size: 15px; fill: #57606a; }
  .png { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; }
  .zip { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
  .unk { fill: #f3f4f6; stroke: #6b7280; stroke-width: 2; stroke-dasharray: 8 6; }
  .flag { fill: #dcfce7; stroke: #15803d; stroke-width: 2; }
  .iend { stroke: #1d4ed8; stroke-width: 3; }
  .arrow { stroke: #57606a; stroke-width: 2; fill: none; }
  .arrowhead { fill: #57606a; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- legend -->
  <rect x="40" y="22" width="26" height="18" class="png"/>
  <text x="74" y="37">PNG（看圖軟體只畫這一段）</text>
  <line x1="330" y1="22" x2="330" y2="40" class="iend"/>
  <text x="340" y="37">IEND：PNG 的結尾</text>
  <rect x="540" y="22" width="26" height="18" class="zip"/>
  <text x="574" y="37">zip（接在 IEND 之後，裡面是下一層）</text>
  <rect x="930" y="22" width="26" height="18" class="unk"/>
  <text x="964" y="37">數字請你自己拆到時填</text>

  <!-- Layer 1: dolls.jpg 651609 bytes; zip at 272492 (42%) -->
  <text x="40" y="92" class="title">dolls.jpg</text>
  <text x="140" y="92" class="mono small">651609 bytes</text>
  <rect x="40" y="104" width="470" height="56" class="png"/>
  <rect x="510" y="104" width="650" height="56" class="zip"/>
  <line x1="510" y1="98" x2="510" y2="166" class="iend"/>
  <text x="54" y="138" class="mono">0  PNG 594×1104</text>
  <text x="524" y="128" class="mono">272492  zip</text>
  <text x="524" y="150" class="mono">name: base_images/2_c.jpg</text>
  <text x="1150" y="138" class="mono small" text-anchor="end">651609</text>

  <!-- arrow 1 -->
  <path d="M 835 166 L 835 200" class="arrow" marker-end="url(#ah)"/>
  <text x="848" y="190" class="small">拆出來，回到步驟 1</text>

  <!-- Layer 2: 2_c.jpg 383919 bytes; zip at 187707 (49%) -->
  <text x="40" y="226" class="title">2_c.jpg</text>
  <text x="130" y="226" class="mono small">383919 bytes</text>
  <rect x="40" y="238" width="548" height="56" class="png"/>
  <rect x="588" y="238" width="572" height="56" class="zip"/>
  <line x1="588" y1="232" x2="588" y2="300" class="iend"/>
  <text x="54" y="272" class="mono">0  PNG 526×1106</text>
  <text x="602" y="262" class="mono">187707  zip</text>
  <text x="602" y="284" class="mono">name: base_images/3_c.jpg</text>
  <text x="1150" y="272" class="mono small" text-anchor="end">383919</text>

  <!-- arrow 2 -->
  <path d="M 874 300 L 874 334" class="arrow" marker-end="url(#ah)"/>

  <!-- Layer 3: 3_c.jpg 201426 bytes; offset unknown -->
  <text x="40" y="360" class="title">3_c.jpg</text>
  <text x="130" y="360" class="mono small">201426 bytes</text>
  <rect x="40" y="372" width="560" height="56" class="png"/>
  <rect x="600" y="372" width="560" height="56" class="unk"/>
  <line x1="600" y1="366" x2="600" y2="434" class="iend"/>
  <text x="54" y="406" class="mono">0  PNG</text>
  <text x="614" y="396" class="mono">?  zip</text>
  <text x="614" y="418" class="mono">name: base_images/4_c.jpg</text>

  <!-- arrow 3 -->
  <path d="M 880 434 L 880 468" class="arrow" marker-end="url(#ah)"/>

  <!-- Layer 4: 4_c.jpg; offset unknown -->
  <text x="40" y="494" class="title">4_c.jpg</text>
  <rect x="40" y="506" width="560" height="56" class="png"/>
  <rect x="600" y="506" width="560" height="56" class="unk"/>
  <line x1="600" y1="500" x2="600" y2="568" class="iend"/>
  <text x="54" y="540" class="mono">0  PNG</text>
  <text x="614" y="530" class="mono">?  zip</text>
  <text x="614" y="552" class="mono">name: flag.txt</text>

  <!-- arrow 4 -> flag -->
  <path d="M 880 568 L 880 596" class="arrow" marker-end="url(#ah)"/>
  <rect x="780" y="598" width="200" height="34" class="flag"/>
  <text x="880" y="621" class="mono" text-anchor="middle">flag.txt</text>
  <text x="996" y="621" class="small">最裡面的娃娃</text>
</svg>
</body>
</html>
