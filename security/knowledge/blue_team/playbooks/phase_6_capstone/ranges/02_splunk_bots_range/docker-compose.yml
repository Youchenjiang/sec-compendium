version: '3.8'

services:
  # -------------------------------------------------------------
  # OpenSearch 輕量化開源 SIEM / 搜尋引擎 (記憶體嚴格控制 1GB)
  # -------------------------------------------------------------
  opensearch-node:
    image: opensearchproject/opensearch:2.11.0
    container_name: bots-opensearch
    environment:
      - cluster.name=bots-cluster
      - node.name=bots-node
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"   # REST API
    networks:
      bots-net:
        ipv4_address: 172.29.0.10
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M

  # -------------------------------------------------------------
  # OpenSearch Dashboards (SIEM 視覺化圖表與威脅獵捕 Web UI)
  # -------------------------------------------------------------
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.0
    container_name: bots-dashboards
    ports:
      - "5601:5601"   # Web UI (http://localhost:5601)
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch-node:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    networks:
      bots-net:
        ipv4_address: 172.29.0.20
    depends_on:
      - opensearch-node
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

networks:
  bots-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
